<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RailBerth</title><link rel="stylesheet" href="style.css"><body><header><h1>RailBerth</h1><p>Choose your train and reserve seats for a demo journey.</p></header><main><section><h2>Journey</h2><form id="journey"><label>Train<select id="train"><option>Tokyo → Sendai · 09:00</option><option>Tokyo → Nagano · 11:30</option><option>Sendai → Tokyo · 15:15</option></select></label><label>Departure date<input type="date" id="date" required></label></form></section><section><h2>Seat selection</h2><div id="seats" class="seats" aria-label="Seat map"></div><form id="booking"><label>Passenger name<input id="passenger" required maxlength="80"></label><button>Reserve selected seats</button></form><output id="status" aria-live="polite"></output></section><section><h2>Reservations on this device</h2><ul id="history"></ul></section></main><script type="module" src="app.js"></script></body></html>
